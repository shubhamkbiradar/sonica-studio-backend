spring.datasource.url=jdbc:h2:mem:sonica_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep context tests self-contained (no Postgres needed)
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Google OAuth2 (test-only placeholders so Spring context can boot)
sonica.oauth.google.client-id=test-client-id
sonica.oauth.google.issuer=https://accounts.google.com
sonica.oauth.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
