spring.datasource.url=jdbc:h2:mem:sonica_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

# Keep logs quiet in tests unless debugging.
sonica.aop.logging.enabled=false

# Satisfy Google OAuth bean wiring during context startup (tests do not call the decoder).
sonica.oauth.google.client-id=test-client-id
sonica.oauth.google.issuer=https://accounts.google.com
sonica.oauth.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
