spring.application.name=sonica

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/sonica_db
spring.datasource.username=sonica
spring.datasource.password=sonica
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Dev default: let Hibernate create/update tables.
# If you want strict schema management via Flyway, switch this back to `validate`
# and enable Flyway after migrations match the entity model.
spring.jpa.hibernate.ddl-auto=update
# Optional override for the safety-net in HibernateSchemaConfig:
# sonica.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
# Disabled for now because the current SQL migrations under `db/migration`
# don't match the JPA entity model (IDs/types/columns), which causes startup failures.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Connection Pooling (HikariCP default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Google OAuth2 (OpenID Connect)
# Frontend obtains a Google ID token, backend verifies it and issues Sonica JWT access/refresh tokens.
sonica.oauth.google.client-id=535231189182-p76535q48ertu3mk1ehbfhuq1b8ahqk3.apps.googleusercontent.com
sonica.oauth.google.issuer=https://accounts.google.com
sonica.oauth.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# AOP (logging/security/tx)
sonica.aop.logging.enabled=true
sonica.aop.logging.log-args=false
sonica.aop.logging.log-result=false
sonica.aop.logging.slow-ms=750

# Logging correlation
sonica.logging.request-id.header=X-Request-Id
